<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MakanMates · Discover Singapore</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <div class="map" id="map" aria-label="Food discovery map"></div>
  <header class="rail">
    <a class="brand" href="#search" aria-label="MakanMates search"><b>●</b>MakanMates</a>
    <nav aria-label="Main navigation"><button data-view="map">Map</button><button data-view="explore">Explore</button><button data-view="trending">Trending</button><a href="#profile" data-view="saved">Saved</a></nav>
    <button id="accountButton">Account</button>
  </header>
  <section class="sidebar" aria-label="Food discovery">
    <section class="search" id="search">
      <label class="search-field"><span aria-hidden="true">⌕</span><input id="query" aria-label="Search places, cuisine or tags" placeholder="Search places, cuisine or tags"></label>
      <div class="search-tools"><select id="sort" aria-label="Sort places"></select><button id="locate">◎ Near me</button></div>
    </section>
    <div class="grid">
      <section class="panel selected-panel" id="selectedPlace" aria-live="polite"></section>
      <section class="results">
        <div class="heading"><div><small>EXPLORE SINGAPORE</small><h1>Find your next bite</h1></div><span id="count"></span></div>
        <div id="places"></div>
      </section>
      <section class="panel" id="profile"><div class="heading"><h2>Your saved places</h2><span id="savedCount">0</span></div><div id="saved"></div></section>
      <section class="panel news-panel"></section>
    </div>
  </section>
  <nav class="chips" aria-label="Filter food spots"></nav>
  <section id="socialFeed" hidden aria-label="Food discovery feed">
    <header class="feed-header"><div><small>MAKANMATES / DISCOVER</small><h1 id="feedTitle">Your next craving.</h1><p>Good food. Shared stories. Somewhere new to try.</p></div><div class="feed-tabs"><button data-view="explore">Explore</button><button data-view="trending">Trending</button></div></header>
    <p class="feed-disclaimer">Demo community · illustrative food photos, not venue photos. Trending uses demo engagement.</p>
    <div id="feedPosts"></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<script src="/mapbox-config.js"></script>
<dialog id="accountDialog"><button id="closeAccount" type="button">Close</button><div id="accountContent"></div><p id="accountMessage" role="status"></p></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/app-config.js"></script>
<script src="accounts.js"></script>
<script src="app.js"></script>
</body>
</html>
